<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#075b35">
<title>MINUYAN NATIONAL HIGH SCHOOL | Policies & Guidelines Portal</title>

<style>
:root {
  --green:#075b35;
  --green2:#0b7545;
  --maroon:#741f32;
  --gold:#e7c94b;
  --ink:#203329;
  --muted:#64756b;
  --line:#dce8df;
  --bg:#f6faf7;
  --white:#fff;
  --shadow:0 12px 32px rgba(7,91,53,.09);
  --radius:18px;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font:16px/1.6 Arial,sans-serif;
}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit}
button{cursor:pointer}

.topbar{
  background:#06452b;
  color:#e6f3e9;
  padding:8px 5%;
  font-size:.82rem;
  display:flex;
  justify-content:space-between;
  gap:8px;
  flex-wrap:wrap;
}

header{
  position:sticky;
  top:0;
  z-index:30;
  background:#fff;
  border-bottom:1px solid var(--line);
}

.nav{
  max-width:1180px;
  margin:auto;
  padding:10px 22px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:900;
  color:var(--green);
  line-height:1.15;
}

.brand img{
  width:48px;
  height:48px;
  object-fit:contain;
}

.brand small{
  display:block;
  font-size:.65rem;
  letter-spacing:.08em;
  color:var(--maroon);
  margin-top:4px;
}

.navlinks{
  display:flex;
  align-items:center;
  gap:5px;
  flex-wrap:wrap;
}

.navlinks button{
  border:0;
  background:transparent;
  padding:9px 11px;
  border-radius:9px;
  color:#42564a;
  font-weight:700;
}

.navlinks button.active,
.navlinks button:hover{
  background:#eaf5ed;
  color:var(--green);
}

.nav-toggle{
  display:none;
  border:1px solid var(--line);
  background:white;
  border-radius:9px;
  padding:7px 11px;
  font-size:1.2rem;
}

main{
  max-width:1180px;
  margin:auto;
  padding:35px 22px 70px;
}

.page{display:none}
.page.active{display:block}

.hero{
  background:linear-gradient(
    120deg,
    #06452b,
    #0b7545 65%,
    #741f32
  );
  color:#fff;
  border-radius:0 0 24px 24px;
}

.hero-inner{
  max-width:1180px;
  margin:auto;
  padding:58px 22px;
  display:grid;
  grid-template-columns:1.2fr .8fr;
  gap:32px;
  align-items:center;
}

.eyebrow{
  color:#f0dc79;
  font-size:.78rem;
  font-weight:800;
  letter-spacing:.12em;
  text-transform:uppercase;
}

h1{
  font-size:clamp(2.25rem,5vw,4rem);
  line-height:1.08;
  margin:14px 0;
}

.hero p{
  color:#e0eee5;
  max-width:620px;
  font-size:1.05rem;
}

.hero-card{
  border:1px solid #ffffff45;
  background:#ffffff13;
  padding:22px;
  border-radius:22px;
}

.hero-logo{
  width:108px;
  height:108px;
  object-fit:contain;
  background:#fff;
  border-radius:50%;
  padding:5px;
  display:block;
  margin-bottom:14px;
}

.stats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:18px;
}

.stat{
  background:#ffffff18;
  padding:12px;
  border-radius:12px;
}

.stat strong{
  display:block;
  font-size:1.5rem;
}

.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  border:0;
  border-radius:11px;
  padding:11px 16px;
  font-weight:750;
}

.btn-primary{
  background:var(--green);
  color:#fff;
}

.btn-light{
  background:#fff;
  color:var(--green);
  border:1px solid var(--line);
}

.btn-maroon{
  background:var(--maroon);
  color:#fff;
}

.page-heading{margin-bottom:22px}

.kicker{
  color:var(--maroon);
  font-weight:850;
  font-size:.75rem;
  letter-spacing:.12em;
  text-transform:uppercase;
}

h2{
  color:var(--green);
  font-size:clamp(1.65rem,3vw,2.2rem);
  margin:5px 0;
}

h3{
  color:var(--green);
  margin:0 0 8px;
}

.muted,.page-heading p{color:var(--muted)}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:16px;
}

.two-col{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
}

.card,.policy-card,.search-panel{
  background:#fff;
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:20px;
  box-shadow:var(--shadow);
}

.policy-card{
  min-height:190px;
  display:flex;
  flex-direction:column;
}

.policy-card h3{
  margin:13px 0 5px;
  font-size:1.08rem;
}

.policy-card p{
  color:var(--muted);
  font-size:.92rem;
  margin-bottom:0;
}

.tag{
  display:inline-block;
  background:#eaf5ed;
  color:var(--green);
  padding:5px 9px;
  border-radius:99px;
  font-size:.72rem;
  font-weight:800;
}

.search-row{
  display:flex;
  gap:10px;
}

.search-row input{
  flex:1;
  min-width:0;
  padding:12px;
  border:1px solid var(--line);
  border-radius:10px;
}

.filters{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:13px;
}

.filter{
  border:1px solid var(--line);
  background:#fff;
  color:#52645a;
  padding:7px 12px;
  border-radius:99px;
  font-weight:700;
}

.filter.active,.filter:hover{
  background:var(--green);
  color:#fff;
}
